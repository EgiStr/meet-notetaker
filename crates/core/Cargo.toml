[package]
name = "notetaker-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Offline transcription. Needs cmake and libclang (LLVM) at build time, so it is off by default.
local-whisper = ["dep:whisper-rs"]

[dependencies]
whisper-rs = { version = "0.16", optional = true }
cpal = "0.15"
hound = "3.5"
polyvoice = { version = "1.0.0", features = ["pipeline-native", "vbx", "audio-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
