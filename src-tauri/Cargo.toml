[package]
name = "meet-notetaker"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "meet_notetaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables STT_PROVIDER=whisper. Needs cmake and libclang (LLVM) at build time.
local-whisper = ["notetaker-core/local-whisper"]

[dependencies]
tauri-plugin-dialog = "2"
notetaker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
# API keys go to the Windows Credential Manager, never into a file.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
