[package]
name = "stage0"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Needs cmake and libclang (LLVM) on PATH; kept optional so the diarization
# benchmarks build without them.
whisper = ["dep:whisper-rs"]

[dependencies]
polyvoice = { version = "1.0.0", features = ["pipeline-native", "vbx", "audio-io"] }
speakrs = { version = "0.7", features = ["cpu"] }
whisper-rs = { version = "0.16", optional = true }
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "transcribe"
required-features = ["whisper"]

[profile.release]
debug = false
