name: Release

# Push a tag such as v0.2.0 to build the Windows installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meet Notetaker ${{ github.ref_name }}
          releaseBody: Installer Windows (NSIS). Unduh berkas *-setup.exe di bawah, lalu jalankan.
          releaseDraft: false
          prerelease: false
